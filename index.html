<style>
  :root {

  header { padding: 64px 0 8px; }

  .avatar {
    width: 132px; height: 132px; border-radius: 50%; flex: 0 0 auto;
    object-fit: cover; background: var(--accent-soft); border: 1px solid var(--line);
    display: grid; place-items: center; font-family: var(--serif);
    font-size: 44px; color: var(--accent); font-weight: 600;
  }
  .hero h1 { font-family: var(--serif); font-size: 40px; line-height: 1.1; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  .hero .tagline { font-size: 18px; color: var(--text); margin: 0 0 2px; }
  .hero .meta { color: var(--muted); font-size: 15px; margin: 0; }
  .contact { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .contact a {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 50%;
    background: var(--surface); color: var(--muted);
    transition: border-color .15s, color .15s, background .15s, transform .15s;
  }
  .contact a:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft); transform: translateY(-2px); text-decoration: none;
  }
  .contact a svg { width: 20px; height: 20px; display: block; }

  /* ---- Sticky nav ---- */
  nav {
    position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(160%) blur(8px); border-bottom: 1px solid var(--line);
    margin-top: 40px;
  }
  nav .wrap { display: flex; gap: 20px; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; }
  nav a { font-size: 14px; color: var(--muted); }
  nav a:hover { color: var(--accent); text-decoration: none; }

  /* ---- Sections ---- */
  section { padding: 40px 0 8px; }
  h2 {
    font-family: var(--serif); font-size: 15px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 20px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }

  .item { margin-bottom: 22px; }

  .title { font-weight: 600; }

  .pub-fig { margin-top: 12px; text-align: center; }

  }

  .teaser-tile .cap { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .teaser-tile:hover .cap { color: var(--accent); }
  .teaser-more { display: inline-block; margin-top: 16px; font-weight: 600; color: var(--accent); }

  /* ---- Gallery (media slider left, text right) ---- */
  .gallery-item { display: flex; gap: 28px; align-items: center; margin: 4px 0 44px; flex-wrap: wrap; }
  .gallery-item:last-child { margin-bottom: 0; }
  .gal-media { flex: 1 1 340px; min-width: 0; position: relative; }
  .gal-stage { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .gal-stage img, .gal-stage video { display: block; width: 100%; height: auto; }
  .gal-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); color: var(--accent); font-size: 20px; line-height: 1;
    cursor: pointer; display: grid; place-items: center; opacity: .92;
  }
  .gal-nav:hover { border-color: var(--accent); }
  .gal-prev { left: 8px; }
  .gal-next { right: 8px; }
  .gal-dots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  .gal-dot { width: 7px; height: 7px; padding: 0; border: none; border-radius: 50%; background: var(--line); cursor: pointer; }
  .gal-dot.active { background: var(--accent); }
  .gal-body { flex: 1 1 250px; min-width: 0; }
  .gal-date { color: var(--accent); font-size: 13px; font-weight: 600; }
  .gal-title { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 3px 0 8px; }
  .gal-text { margin: 0; }

  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 56px 0 40px; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    .hero h1 { font-size: 32px; }
    header { padding-top: 40px; }
    .row .when { white-space: normal; }
  }
</style>
</head>
<body>
  <div id="app"></div>

<script>
  // ---------- tiny helpers ----------
  const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  // Text formatting for any field:
  //   **bold name**      → highlighted (your name in author lists)
  //   [label](https://…) → a link
  //   _italic_           → italic text
  // (links are handled first so italics/bold never touch the URL or markup)
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<span class="me">$1</span>')
    .replace(/_(.+?)_/g, '<em>$1</em>');
  const md = s => {
    s = esc(s);
    let out = "", last = 0, re = /\[(.+?)\]\((.+?)\)/g, m;
    while ((m = re.exec(s))) {
      out += inline(s.slice(last, m.index));
      out += '<a href="' + m[2] + '" target="_blank" rel="noopener">' + inline(m[1]) + '</a>';
      last = m.index + m[0].length;
    }
    return out + inline(s.slice(last));
  };

  const app = document.getElementById("app");
  const sections = [];   // collect for nav
  const pages = new Map();  // id -> element for standalone pages (hidden until clicked)
  const addSection = (id, label, node) => { node.id = id; sections.push({ id, label }); return node; };

  // ---------- header ----------
  const header = $("header");
  const hwrap = $("div", "wrap");
  const hero = $("div", "hero");

  // avatar with graceful fallback to initials
  const initials = SITE.name.replace(/\(.*?\)/g, "").trim().split(/\s+/).map(w => w[0]).slice(0,2).join("");
  const img = new Image();
  const avatar = $("div", "avatar", esc(initials));
  if (SITE.photo) {
    img.src = SITE.photo; img.alt = SITE.name; img.className = "avatar";
    img.onload = () => avatar.replaceWith(img);
  }
  hero.appendChild(avatar);

  const hinfo = $("div");
  hinfo.appendChild($("h1", null, esc(SITE.name)));
  hinfo.appendChild($("p", "tagline", esc(SITE.tagline)));
  hinfo.appendChild($("p", "meta", [SITE.affiliation, SITE.location].filter(Boolean).map(esc).join(" · ")));

  // Icons (inline SVG, inherit the link color). To add a new link type,
  // add its URL in the SITE.links block above and an icon+label line here.
  const ICONS = {
    email:    '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 5.5A1.5 1.5 0 0 1 3.5 4h17A1.5 1.5 0 0 1 22 5.5v13A1.5 1.5 0 0 1 20.5 20h-17A1.5 1.5 0 0 1 2 18.5v-13Zm2.2.5 7.8 5.6L19.8 6H4.2ZM20 7.4l-7.4 5.3a1 1 0 0 1-1.2 0L4 7.4V18h16V7.4Z"/></svg>',
    scholar:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 1 8l11 6 9-4.9V16h2V8L12 2Z"/><path fill="currentColor" d="M6 12.4v3.1c0 1.7 2.7 3 6 3s6-1.3 6-3v-3.1l-6 3.3-6-3.3Z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0Z"/></svg>',
    github:   '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.05.78 2.12v3.14c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>',
    cv:       '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 2h8l4 4v16H6V2Zm7 1.5V7h3.5L13 3.5ZM8 11h8v1.5H8V11Zm0 3h8v1.5H8V14Zm0 3h5v1.5H8V17Z"/></svg>',
    website:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 0c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18M3.5 9h17M3.5 15h17"/></svg>',
    tool:     '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M7 10h3V7L6.5 3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1-3 3l-6-6a6 6 0 0 1-8-8L7 10Z"/></svg>',
    instagram:'<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></g><circle cx="17.3" cy="6.7" r="1.15" fill="currentColor"/></svg>'
  };
  const L = SITE.links, contact = $("div", "contact");
  const linkDefs = [
    ["email",    L.email ? "mailto:" + L.email : "", "Email"],
    ["scholar",  L.scholar,  "Google Scholar"],
    ["linkedin", L.linkedin, "LinkedIn"],
    ["github",   L.github,   "GitHub"],
    ["cv",       L.cv,       "CV (PDF)"]
  ];
  linkDefs.forEach(([key, href, label]) => {
    if (!href) return;
    const a = $("a", null, ICONS[key] || esc(label));
    a.href = href; a.title = label; a.setAttribute("aria-label", label);
    if (key !== "email") { a.target = "_blank"; a.rel = "noopener"; }
    contact.appendChild(a);
  });
  hinfo.appendChild(contact);
  hero.appendChild(hinfo);
  hwrap.appendChild(hero);
  header.appendChild(hwrap);
  app.appendChild(header);

  // ---------- nav (built after sections are known) ----------
  const nav = $("nav"); const navWrap = $("div", "wrap"); nav.appendChild(navWrap); app.appendChild(nav);

  // Academic sections live in this container so the "Life" page can hide them.
  const academic = $("div"); academic.id = "academic"; app.appendChild(academic);

  // ---------- section builder ----------
  // opts.standalone: true  → the section is its OWN page, hidden from the main
  // page and shown only when its menu link is clicked (like the Life page).
  const makeSection = (id, label, buildBody, opts) => {
    opts = opts || {};
    const body = SITE[id];
    // skip empty sections automatically
    if (Array.isArray(body) && body.length === 0) return;
    const s = $("section"); const w = $("div", "wrap");
    w.appendChild($("h2", null, esc(label)));
    buildBody(w);
    s.appendChild(w);
    addSection(id, label, s);
    if (opts.standalone) {
      s.classList.add("page"); s.style.display = "none";
      app.appendChild(s); pages.set(id, s);
    } else {
      academic.appendChild(s);
    }
  };

  // About
  makeSection("about", "About", w => {
    SITE.about.forEach(p => w.appendChild($("p", null, md(p))));
    if (SITE.interests && SITE.interests.length) {
      w.appendChild($("div", "subhead", "Research interests"));
      const ul = $("ul", "interests");
      SITE.interests.forEach(it => ul.appendChild($("li", null, md(it))));
      w.appendChild(ul);
    }
  });

  // News — show the first few; a "Show more" button reveals the rest.
  makeSection("news", "News", w => {
    const LIMIT = 3;   // ← how many news items to show before "Show more"
    SITE.news.forEach((n, i) => {
      const row = $("div", "news-item" + (i >= LIMIT ? " news-extra" : ""));
      row.appendChild($("div", "date", esc(n.date)));
      row.appendChild($("div", null, md(n.text)));
      w.appendChild(row);
    });
    if (SITE.news.length > LIMIT) {
      const btn = $("button", "more-btn", "Show more ↓");
      let open = false;
      btn.addEventListener("click", () => {
        open = !open;
        w.querySelectorAll(".news-extra").forEach(e => e.style.display = open ? "flex" : "");
        btn.innerHTML = open ? "Show less ↑" : "Show more ↓";
      });
      w.appendChild(btn);
    }
  });

  // ---- Homepage teaser: a peek at the Gallery (built from the gallery data) ----
  if (SITE.gallery && SITE.gallery.length) {
    const s = $("section"); s.id = "gallery-teaser";
    const w = $("div", "wrap");
    w.appendChild($("h2", null, "From the Gallery"));
    const strip = $("div", "teaser-strip");
    SITE.gallery.slice(0, 3).forEach(item => {
      const first = (item.media || [])[0];
      if (!first) return;
      const tile = $("a", "teaser-tile"); tile.href = "#gallery";
      const thumb = $("div", "thumb");
      if (/\.(mp4|webm|mov|m4v|ogg)$/i.test(first)) {
        const v = document.createElement("video");
        v.src = first; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
        v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.setAttribute("aria-hidden", "true");
        thumb.appendChild(v);
      } else {
        const im = new Image(); im.src = first; im.alt = item.title || ""; im.loading = "lazy";
        thumb.appendChild(im);
      }
      tile.appendChild(thumb);
      if (item.title) tile.appendChild($("div", "cap", esc(item.title)));
      strip.appendChild(tile);
    });
    w.appendChild(strip);
    const more = $("a", "teaser-more", "See the gallery →"); more.href = "#gallery";
    w.appendChild(more);
    s.appendChild(w);
    academic.appendChild(s);
  }

  // Selected Publications & Patents (combined)
  makeSection("publications", "Selected Publications & Patents", w => {
    const ol = $("ol", "pubs");
    SITE.publications.forEach(p => {
      const li = $("li");
      const body = $("div", "pub-body");
      const t = p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${md(p.title)}</a>` : md(p.title);
      const roleTag = p.role ? `<br><span class="pub-role">${esc(p.role)}</span>` : "";
      body.innerHTML = `<span class="pub-title">${t}</span><br>${md(p.authors)}<br><span class="pub-venue">${md(p.venue)} · ${esc(p.year)}</span>${roleTag}`;
      li.appendChild(body);
      // optional figure, shown BELOW the citation (whole image; hidden if missing)
      if (p.figure) {
        const fig = $("div", "pub-fig");
        const im = new Image();
        im.src = p.figure; im.alt = p.title; im.loading = "lazy";
        im.style.width = (p.figw || 640) + "px";   // tuned so text matches across figures
        im.onerror = () => fig.remove();
        if (p.link) {
          const a = $("a"); a.href = p.link; a.target = "_blank"; a.rel = "noopener";
          a.appendChild(im); fig.appendChild(a);
        } else { fig.appendChild(im); }
        li.appendChild(fig);
      }
      ol.appendChild(li);
    });
    w.appendChild(ol);

    if (SITE.patents && SITE.patents.length) {
      w.appendChild($("div", "subhead", "Patents"));
      SITE.patents.forEach(p => {
        const d = $("div", "item");
        const t = p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${md(p.title)}</a>` : md(p.title);
        d.innerHTML = `<span class="pub-title">${t}</span><br>${md(p.authors)}<br><span class="pub-venue">${md(p.venue)} · ${esc(p.year)}</span>`;
        w.appendChild(d);
      });
    }
  });

  // Presentations — split into Talks and Posters (standalone page)
  makeSection("presentations", "Presentations", w => {
    [["Talks", "talk"], ["Posters", "poster"]].forEach(([label, type]) => {
      const items = SITE.presentations.filter(p => (p.type || "talk") === type);
      if (!items.length) return;
      w.appendChild($("div", "subhead", label));
      items.forEach(p => {
        const d = $("div", "item");
        d.appendChild($("div", "title", esc(p.title)));
        d.appendChild($("div", "when", esc(p.year)));
        d.appendChild($("div", "sub", esc(p.venue)));
        w.appendChild(d);
      });
    });
  }, { standalone: true });

  // Teaching & Mentoring (combined)
  makeSection("teaching", "Teaching & Mentoring", w => {
    SITE.teaching.forEach(t => {
      const d = $("div", "item");
      d.appendChild($("div", "title", esc(t.role)));
      d.appendChild($("div", "when", esc(t.dates)));
      d.appendChild($("div", "sub", esc(t.org)));
      if (t.note) d.appendChild($("div", "note", esc(t.note)));
      w.appendChild(d);
    });

    if (SITE.mentoring && SITE.mentoring.length) {
      w.appendChild($("div", "subhead", "Mentoring"));
      SITE.mentoring.forEach(m => {
        // Name — Major ’YY · time · current role   (blank parts are skipped)
        const meta = [m.major, m.time, m.role].filter(Boolean).map(esc).join(" · ");
        const d = $("div", "mentee");
        d.innerHTML = `<span class="mentee-name">${esc(m.name)}</span>` +
                      (meta ? ` <span class="mentee-meta">— ${meta}</span>` : "");
        w.appendChild(d);
      });
    }
  }, { standalone: true });

  // Awards
  makeSection("awards", "Awards & Honors", w => {
    const ul = $("ul", "awards-list");
    SITE.awards.forEach(a => {
      const li = $("li");
      li.appendChild($("div", "ayear", esc(a.year)));
      li.appendChild($("div", null, md(a.text)));
      ul.appendChild(li);
    });
    w.appendChild(ul);
  });

  // ---------- Gallery page (hidden until the "Gallery" menu link is clicked) ----------
  let galleryView = null;
  if (SITE.gallery && SITE.gallery.length) {
    galleryView = $("div", "page"); galleryView.id = "gallery"; galleryView.style.display = "none";
    const gw = $("div", "wrap");
    gw.appendChild($("h2", null, "Gallery"));

    SITE.gallery.forEach(item => {
      const row = $("div", "gallery-item");

      // LEFT — media slider (photos and/or a playable video)
      const media = $("div", "gal-media");
      const stage = $("div", "gal-stage");
      media.appendChild(stage);
      const files = item.media || [];
      const dots = $("div", "gal-dots");
      const isVideo = s => /\.(mp4|webm|mov|m4v|ogg)$/i.test(s);
      let idx = 0;
      const show = i => {
        idx = (i + files.length) % files.length;
        stage.innerHTML = "";
        const src = files[idx];
        if (isVideo(src)) {
          const v = document.createElement("video");
          v.src = src; v.controls = true; v.preload = "metadata"; v.playsInline = true;
          stage.appendChild(v);
        } else {
          const im = new Image(); im.src = src; im.alt = item.title || ""; im.loading = "lazy";
          stage.appendChild(im);
        }
        dots.querySelectorAll("button").forEach((d, di) => d.classList.toggle("active", di === idx));
      };
      if (files.length) show(0);
      if (files.length > 1) {
        const prev = $("button", "gal-nav gal-prev", "‹"); prev.setAttribute("aria-label", "Previous");
        const next = $("button", "gal-nav gal-next", "›"); next.setAttribute("aria-label", "Next");
        prev.onclick = () => show(idx - 1); next.onclick = () => show(idx + 1);
        media.appendChild(prev); media.appendChild(next);
        files.forEach((_, di) => {
          const d = $("button", "gal-dot" + (di === 0 ? " active" : ""));
          d.setAttribute("aria-label", "Slide " + (di + 1));
          d.onclick = () => show(di);
          dots.appendChild(d);
        });
        media.appendChild(dots);
      }
      row.appendChild(media);

      // RIGHT — title, date, paragraph, links
      const body = $("div", "gal-body");
      if (item.date)  body.appendChild($("div", "gal-date", esc(item.date)));
      if (item.title) body.appendChild($("div", "gal-title", esc(item.title)));
      if (item.text)  body.appendChild($("p", "gal-text", md(item.text)));
      const gl = item.links || {};
      const links = $("div", "contact gal-links");
      [["github", "GitHub"], ["linkedin", "LinkedIn"], ["instagram", "Instagram"], ["tool", "Try the tool"], ["website", "Website"]].forEach(([k, label]) => {
        if (!gl[k]) return;
        const a = $("a", null, ICONS[k] || esc(label));
        a.href = gl[k]; a.target = "_blank"; a.rel = "noopener";
        a.title = label; a.setAttribute("aria-label", label);
        links.appendChild(a);
      });
      if (links.children.length) body.appendChild(links);
      row.appendChild(body);

      gw.appendChild(row);
    });

    galleryView.appendChild(gw);
    app.appendChild(galleryView);
    pages.set("gallery", galleryView);
  }

  // ---------- fill nav ----------
  // Home sections scroll in place; standalone pages (in `pages`) swap the view.
  // Short menu labels (headings stay full) so the top bar fits on one row.
  const NAV_LABELS = { publications: "Publications", teaching: "Teaching", awards: "Awards" };
  sections.forEach(s => {
    const a = $("a", null, esc(NAV_LABELS[s.id] || s.label)); a.href = "#" + s.id;
    navWrap.appendChild(a);
  });
  if (galleryView) {
    const a = $("a", null, "Gallery"); a.href = "#gallery";
    navWrap.appendChild(a);
  }

  // ---------- footer ----------
  const footer = $("footer");
  footer.appendChild($("div", "wrap", `© <span id="yr"></span> ${esc(SITE.name)}`));
  app.appendChild(footer);
  const yrEl = document.getElementById("yr"); if (yrEl) yrEl.textContent = new Date().getFullYear();

  document.title = SITE.name;

  // ---------- router ----------
  // A hash matching a standalone page (Presentations, Teaching & Mentoring,
  // Life) shows that page alone; any other hash shows the main page and
  // scrolls to the matching section.
  function route() {
    const h = location.hash.replace(/^#/, "");
    const onPage = pages.has(h);
    academic.style.display = onPage ? "none" : "";
    pages.forEach((el, id) => { el.style.display = (id === h) ? "" : "none"; });
    navWrap.querySelectorAll("a").forEach(a =>
      a.classList.toggle("active", a.getAttribute("href") === "#" + h));
    if (onPage) window.scrollTo(0, 0);
    else if (h && document.getElementById(h)) document.getElementById(h).scrollIntoView();
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
